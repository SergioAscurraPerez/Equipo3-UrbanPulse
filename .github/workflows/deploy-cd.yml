name: Master Deploy (CD) & Auto-Rollback

on:
  push:
    branches: [ main ]

jobs:
  deploy-and-verify:
    name: Despliegue en Render y Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: 1. Disparar Despliegue en Render (n8n)
        run: |
          echo "Avisando a Render para sincronizar los últimos flujos de n8n..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || true

      - name: 2. Esperar estabilización del servidor
        run: sleep 45

      - name: 3. Health Check Automático (Verificación de Caída)
        id: health_check
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://urbanpulse-n8n.onrender.com/healthz)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "🚨 ¡ALERTA! El servidor no responde o colapsó por memoria (Status $HTTP_STATUS)."
            exit 1
          else
            echo "✅ Servidor operativo y estable."
          fi

      - name: 4. Botón de Pánico (Auto-Rollback)
        if: failure()
        run: |
          echo "🔄 Iniciando proceso de ROLLBACK Automático..."
          echo "El último commit rompió producción. El equipo debe revertir el Pull Request inmediatamente."
          exit 1