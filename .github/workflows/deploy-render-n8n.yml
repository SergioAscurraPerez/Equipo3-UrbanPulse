# ==============================================================================
# Workflow: Deploy n8n to Render
# Propósito: Conectar el despliegue de n8n en Render al pipeline de CI/CD del 
#            repositorio. Dado que n8n se despliega desde una imagen oficial de 
#            Docker Hub y no directamente desde este repo, este webhook le avisa 
#            a Render que hay nuevos cambios aprobados en main (ej. nuevos 
#            workflows JSON exportados) y debe redesplegar para aplicarlos.
# ==============================================================================

name: Deploy n8n to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    
    
    steps:
      - name: Llamar al Webhook de Render
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"