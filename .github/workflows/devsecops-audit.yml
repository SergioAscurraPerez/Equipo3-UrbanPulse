name: DevSecOps - Auditoria de Seguridad en Produccion y Generacion SBOM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/frontend/**'
      - 'scripts/devsecops-live-audit.js'
      - '.github/workflows/devsecops-audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/frontend/**'
      - 'scripts/devsecops-live-audit.js'
      - '.github/workflows/devsecops-audit.yml'
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  audit-and-sbom:
    name: Auditoria DevSecOps y Generación SBOM CycloneDX (HT-44 T03)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar Inventario de Software (SBOM CycloneDX) (HT-44 T03)
        uses: anchore/sbom-action@v0
        with:
          path: ./src/frontend
          format: cyclonedx-json
          output-file: docs/cyclonedx-sbom.json

      - name: Ejecutar Suite de Auditoria DevSecOps
        run: |
          node scripts/devsecops-live-audit.js

      - name: Publicar Dashboard Visual en GitHub Actions (Step Summary)
        if: always()
        run: |
          if [ -f "docs/SECURITY_COMPLIANCE_AUDIT_REPORT.md" ]; then
            cat docs/SECURITY_COMPLIANCE_AUDIT_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar Certificacion en GitHub Code Scanning (SARIF)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: docs/security-audit.sarif
          category: devsecops-compliance

      - name: Subir Reporte SBOM CycloneDX como Artefacto (HT-44 T03)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-report
          path: docs/cyclonedx-sbom.json
          retention-days: 30

      - name: Subir Reporte Oficial como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-auditoria-devsecops-sprint3
          path: docs/SECURITY_COMPLIANCE_AUDIT_REPORT.md
          retention-days: 90
