name: MLOps - Monitoreo de Deriva y Auto Re-entrenamiento (HT-49 T03)

on:
  schedule:
    - cron: '0 0 * * *' # Ejecución diaria a medianoche
  workflow_dispatch:
    inputs:
      simulate_drift:
        description: 'Simular Data Drift para verificar auto re-entrenamiento'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  drift-monitoring:
    name: 🔍 Monitoreo de Deriva (Evidently / MLflow) & Auto Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar Evaluación de Deriva del Modelo
        id: drift_eval
        run: |
          SIMULATE_FLAG=""
          if [ "${{ github.event.inputs.simulate_drift }}" == "true" ]; then
            SIMULATE_FLAG="--simulate-drift"
          fi
          
          OUTPUT=$(python ia-ops/scripts/monitor_drift.py ${SIMULATE_FLAG})
          echo "${OUTPUT}"
          
          DERIVA_VAL=$(echo "${OUTPUT}" | grep "DERIVA_DETECTADA=" | cut -d'=' -f2)
          echo "deriva=${DERIVA_VAL}" >> $GITHUB_OUTPUT

      - name: Reportar Incidente en Jira Service Desk si hay Deriva (HT-49 T03)
        if: steps.drift_eval.outputs.deriva == 'true'
        run: |
          echo "🚨 ALERTA: Data Drift detectado en producción (deriva=true). Registrando ticket en Jira Service Desk..."
          JIRA_URL="https://urbanpulse-ti.atlassian.net/rest/api/3/issue"
          JIRA_EMAIL="emily_peralta@usmp.pe"
          JIRA_TOKEN="${{ secrets.JIRA_SERVICE_DESK_TOKEN || secrets.JIRA_API_TOKEN }}"
          
          if [ -z "${JIRA_TOKEN}" ]; then
            echo "⚠️ AVISO: JIRA_SERVICE_DESK_TOKEN no configurado. Omitiendo notificación HTTP a Jira."
            exit 0
          fi

          AUTH=$(echo -n "${JIRA_EMAIL}:${JIRA_TOKEN}" | base64 | tr -d '\n')
          
          PAYLOAD=$(cat <<EOF
          {
            "fields": {
              "project": { "key": "UPTI" },
              "summary": "INCIDENTE MLOps: Deriva del modelo urbanpulse_risk_classifier v1.0.0",
              "description": {
                "type": "doc",
                "version": 1,
                "content": [
                  {
                    "type": "paragraph",
                    "content": [
                      {
                        "type": "text",
                        "text": "ALERTA AUTOMÁTICA MLOps: El monitoreo diario de Evidently/MLflow ha detectado Data Drift (PSI > 0.20) en el modelo urbanpulse_risk_classifier. Se ha disparado el re-entrenamiento automático en GitHub Actions."
                      }
                    ]
                  }
                ]
              },
              "issuetype": { "id": "16" }
            }
          }
          EOF
          )

          curl --silent --request POST \
            --url "${JIRA_URL}" \
            --header "Authorization: Basic ${AUTH}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "${PAYLOAD}" || true

      - name: Disparar Auto Re-entrenamiento en mlops-pipeline.yml (HT-49 T03)
        if: steps.drift_eval.outputs.deriva == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🚀 Disparando automáticamente mlops-pipeline.yml para re-entrenar modelo Challenger...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mlops-pipeline.yml',
              ref: 'main',
              inputs: {
                action_mode: 'deploy_new_champion'
              }
            });
            console.log('✅ Re-entrenamiento automático solicitado a GitHub Actions.');

      - name: Publicar Summary en GitHub Actions
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 📈 Reporte de Monitoreo MLOps (Data Drift & Performance)

          - **Modelo Auditado:** `urbanpulse_risk_classifier`
          - **Estado de Deriva (`deriva`):** ${{ steps.drift_eval.outputs.deriva == 'true' && '🚨 **DERIVA DETECTADA (Re-entrenamiento iniciado)**' || '🟢 **SISTEMA ESTABLE (No Drift)**' }}
          - **Acción Ejecutada:** ${{ steps.drift_eval.outputs.deriva == 'true' && 'Ticket de Incidente Creado en Jira + Re-entrenamiento automático en mlops-pipeline.yml' || 'Monitoreo diario completado sin novedad.' }}
          EOF

      - name: Subir Reporte JSON de Monitoreo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-monitoring-report
          path: docs/DRIFT_MONITORING_REPORT.json
          retention-days: 30
