# ==============================================================================
# Blueprint Render — UrbanPulse DevSecOps (Infraestructura como Código)
# Arquitectura Serverless Desacoplada: Render (Compute) + Neon (Vector DB)
# ==============================================================================

services:
  - type: web
    name: urbanpulse-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: free
    region: oregon 
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: "https"
      - key: N8N_HOST
        sync: false 
      - key: N8N_WEBHOOK_URL
        sync: false 
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_ENCRYPTION_KEY
        generateValue: true 
      - key: N8N_CORS_ALLOWED_ORIGINS
        sync: false 
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      # --- TUNING ANTI-CRASH PARA FREE TIER ---
      - key: NODE_OPTIONS
        value: "--max-old-space-size=300"
      - key: N8N_RUNNERS_ENABLED
        value: "false"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      # --- CONEXIÓN A NEON (POSTGRESQL) ---
      - key: DB_TYPE
        value: "postgresdb"
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DB_POSTGRESDB_HOST
        sync: false 
      - key: DB_POSTGRESDB_DATABASE
        sync: false 
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false